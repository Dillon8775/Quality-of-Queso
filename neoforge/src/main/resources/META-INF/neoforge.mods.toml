# Core
modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "${issues}"

# Mod Information
[[mods]]
modId = "${mod_id}"
version = "${mod_version}+${mc_version}"
displayName = "${mod_name}"
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional (see https://docs.neoforged.net/docs/misc/updatechecker/)
displayURL = "${homepage}"

# Logo/Banner
bannerFile = "${logo}.png"
iconFile = "${logo}.png"

# Credits & Attribution
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''

# Mixins
[[mixins]]
config = "${mod_id}.mixins.json"

# NeoForge Dependency
[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required" # (can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[${neoforge_loader_version},)"
ordering = "NONE"
side = "BOTH" # 'BOTH', 'CLIENT' or 'SERVER'

# Minecraft Dependency
[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required" # (can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH" # 'BOTH', 'CLIENT' or 'SERVER'

[[dependencies.${ mod_id }]]
modId = "balm"
type = "required" # (can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[${balm_version},)"
ordering = "NONE"
side = "BOTH" # 'BOTH', 'CLIENT' or 'SERVER'

[[dependencies.${ mod_id }]]
modId = "dillonlib"
type = "required" # (can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[${dillonlib_version},)"
ordering = "NONE"
side = "BOTH" # 'BOTH', 'CLIENT' or 'SERVER'

[[dependencies.${ mod_id }]]
modId="controlify"
type="incompatible"  # (can be one of "required", "optional", "incompatible" or "discouraged")
versionRange="[0,)"

[[dependencies.${ mod_id }]]
modId="norecipebookshift"
type="incompatible"  # (can be one of "required", "optional", "incompatible" or "discouraged")
versionRange="[0,)"