pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net'
        }
        maven {
            name = 'Parchment'
            url = 'https://maven.parchmentmc.org'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
}

rootProject.name = 'QoQ'

// === COMMON ===
include "modules:common"

// === FABRIC ===
include "modules:fabric-mc1.21.11"
include "modules:fabric-mc1.21.9x"

// === FORGE ===
include "modules:forge-mc1.21.11"
include "modules:forge-mc1.20.1"
// ----------

// You can add as many modules as you want, for this copy the content of "example_module" to each new module!
//include "modules:example_module"

